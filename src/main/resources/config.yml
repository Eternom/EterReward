# ============================================================
#  EterReward
# ============================================================
#
#  Récompense quotidienne (/daily) : une par jour et par joueur, sur tout le
#  réseau. Une série de 7 jours : chaque jour réclamé d'affilée fait avancer
#  d'un jour, un jour manqué fait repartir au jour 1, et après le jour 7 la
#  série recommence. Les textes sont dans lang/.
#  Valeurs calées sur la grille de l'économie (README d'EterEconomy, « Repères
#  économiques ») : un cycle complet vaut environ 600 à 750 Heloks (10 % du revenu des quêtes).
#  Toute modification nécessite un redémarrage du serveur.

daily:
  # Le jour change à minuit dans ce fuseau, le même pour tout le monde.
  time-zone: Europe/Paris

  # Minutes de jeu actif dans la journée (temps de jeu du pass, AFK exclu) avant de pouvoir réclamer : un second compte
  # connecté juste pour la récompense ne l'a pas. 0 : réclamable dès l'arrivée.
  min-active-minutes: 15

  # Pour chaque jour : une icône, et un ou plusieurs tirages possibles (loots).
  # Un seul tirage est donné, au hasard : plus son poids (weight) est grand,
  # plus il a de chances de sortir (le menu affiche le pourcentage).
  # Un tirage peut donner, ensemble :
  #   money    : de l'argent (EterEconomy)
  #   items    : des objets, "MATIÈRE quantité" (ex : "DIAMOND 3") ; ce qui ne
  #              rentre pas dans l'inventaire est posé au sol devant le joueur
  #   commands : des commandes lancées par la console, {player} = le pseudo
  #   label    : texte montré à la place du détail (utile pour une commande,
  #              ex : "Clé de caisse rare"), format MiniMessage
  days:
    1:
      icon: WHEAT
      loots:
        - weight: 70
          money: 20
        - weight: 30
          items: [ "BREAD 6" ]
    2:
      icon: COAL
      loots:
        - weight: 70
          money: 30
        - weight: 30
          items: [ "COAL 10" ]
    3:
      icon: IRON_INGOT
      loots:
        - weight: 60
          money: 50
        - weight: 40
          items: [ "IRON_INGOT 5" ]
    4:
      icon: GOLD_INGOT
      loots:
        - weight: 60
          money: 70
        - weight: 40
          items: [ "GOLD_INGOT 5" ]
    5:
      icon: LAPIS_LAZULI
      loots:
        - weight: 60
          money: 100
        - weight: 40
          items: [ "EXPERIENCE_BOTTLE 8" ]
    6:
      icon: EMERALD
      loots:
        - weight: 60
          money: 130
        - weight: 40
          items: [ "DIAMOND 1" ]
    7:
      icon: NETHER_STAR
      loots:
        - weight: 60
          money: 200
          items: [ "DIAMOND 1" ]
        - weight: 30
          money: 350
        - weight: 10
          money: 150
          items: [ "NETHERITE_SCRAP 1" ]
        # Exemple avec une commande :
        # - weight: 5
        #   label: "<accent>Clé de caisse rare"
        #   commands: [ "crate give {player} rare 1" ]

# Pass de saison (/pass) : chaque mois (dans le fuseau daily.time-zone), un des pass de passes/ est tiré au hasard
# (quelques jours avant la fin du mois d'avant), jamais un des derniers mois, le même pour tout le réseau. 30 paliers,
# une ligne gratuite et une premium, puis des paliers bonus répétables. Un pass = un fichier de passes/ (le nom du
# fichier est son identifiant) ; les 10 fournis sont copiés s'ils manquent. Pour retirer un pass : « enabled: false ».
# /eterreward pass reload relit cette section et passes/ sur tous les serveurs, sans redémarrage.
pass:
  # XP pour passer un palier. Repères avec les valeurs ci-dessous et les défis (challenges.yml) :
  # - joueur occasionnel (1 h de jeu, /daily, 1 quête normale, 1 défi du jour : ~900 XP/jour) : palier 22 environ
  #   en fin de mois ;
  # - joueur assidu (temps plafonné, /daily, 3 quêtes + la bonus, tous les défis : ~2 150 XP/jour) : fini vers le
  #   17e jour, vers le 14e quand le bonus du mois est sur son métier.
  # Attention en montant l'XP des quêtes ou des défis : ce sont eux qui font finir le pass trop vite.
  xp-per-tier: 1200
  # Coût de chaque palier, dans l'ordre (la dernière valeur vaut pour les paliers suivants) ; vide : xp-per-tier
  # partout. Par défaut, les premiers paliers vont plus vite pour accrocher les nouveaux.
  xp-curve: [ 600, 800, 1000, 1200 ]

  # Paliers bonus, au-delà du dernier : un tous les « xp », « max » au plus par mois, chacun réclamable (ligne gratuite).
  # max: 0 pour ne pas en avoir.
  overflow:
    xp: 2400
    max: 20
    money: 150
    keys: 0

  # Temps de jeu ACTIF (le joueur a bougé, agi ou parlé dans la minute) : XP par minute, et plafond par jour
  # (100 minutes) : l'AFK ne suffit pas, il faut faire les quêtes pour finir le pass.
  playtime-xp-per-minute: 5
  playtime-daily-cap: 500
  # Plafond multiplié certains jours (MONDAY ... SUNDAY).
  playtime-cap-days:
    SATURDAY: 1.5
    SUNDAY: 1.5
  # Part du plafond NON utilisée la veille reportée sur le jour (0,5 = la moitié ; un seul jour reporté ; 0 : rien).
  playtime-carry-over: 0.5
  # Temps de jeu multiplié dans certains mondes (début du nom du monde), ex : « ressource: 1.25 ».
  world-xp: {}

  # Récompense du jour (/daily) réclamée.
  daily-xp: 300
  # Quête de métier validée (EterJob), selon sa difficulté ; bonus = la quête bonus du jour.
  quest-xp:
    easy: 100
    normal: 200
    hard: 300
    bonus: 300
  # Succès débloqué (EterSuccess) : XP par point de succès (0 : rien).
  success-xp-per-point: 10

  # Rattrapage : un joueur en retard sur le rythme « attendu » (expected-end-tier paliers en fin de mois, réparti sur
  # les jours) de plus de « margin » paliers gagne « multiplier » fois plus d'XP (sauf le temps de jeu).
  # expected-end-tier: 0 pour désactiver.
  catch-up:
    expected-end-tier: 22
    margin: 3
    multiplier: 2

  # Objectifs de clan (EterClan, à partir de premium.clan-min-members membres) : quand le palier MOYEN des membres
  # atteint average-tier, chaque membre gagne « xp », une fois par mois et par objectif. Vide : pas d'objectifs.
  clan-goals:
    - average-tier: 10
      xp: 600
    - average-tier: 20
      xp: 1200

  # Jours pour réclamer les récompenses du mois d'avant (0 : perdues à la fin du mois).
  grace-days: 7
  # Le pass du mois suivant est tiré ce nombre de jours avant la fin du mois ; son aperçu est visible dans le menu
  # les preview-days derniers jours.
  draw-ahead-days: 6
  preview-days: 3
  # Un pass ne revient pas avant ce nombre de mois (s'il y a assez de pass).
  no-repeat-months: 3

  # Premium du mois. Donné par la boutique (/eterreward pass premium <joueur> [acheteur] [paliers]) ou acheté en jeu.
  # Le grade qui l'a tous les mois : permission eterreward.pass.premium.always.
  premium:
    # Lien du bouton premium du menu (vide : pas de lien).
    shop-url: "https://craft.eternom.fr/shop"
    # Prix en jeu (Heloks) ; 0 : pas d'achat en jeu, seulement la boutique. Repère : ~10 jours de quêtes.
    price: 0
    # Acheté en jeu pour tout son clan (le chef paie pour les membres qui ne l'ont pas) : réduction, et taille minimale.
    clan-discount: 0.25
    clan-min-members: 3
    # Acheté dans les derniers jours du mois : le mois suivant est compris.
    late-buy-days: 5
    # Chaque premium donne l'insigne du mois (objet de collection, dans la boîte /pass box).
    badge: true

  # Annonce du nouveau pass le 1er du mois à tous les joueurs (et le bilan du mois d'avant au staff).
  announce: true
  # Annonces et bilans aussi sur un salon Discord (URL d'un webhook ; vide : non).
  discord-webhook: ""

# Classements (/ranking), recalculés toutes les 5 minutes. Du mois (remis à zéro chaque mois) : XP du pass, défis
# et quêtes de métier réussis, votes, temps de jeu actif, et le GÉNÉRAL (moyenne des cinq : une note sur 100 selon la
# place dans chacun ; les paliers du pass comptent, premium ou non). Depuis toujours : points de succès, fortune, clans
# (le temps de jeu total est dans /stats d'EterSuccess). Temps de jeu du mois : seules les minutes où le joueur a
# regardé autour de lui ou parlé (AFK exclu).
# Le général a son podium (5 PNJ, EterNpc : /eterreward podium <1-5>) et ses placeholders (PlaceholderAPI).
# rewarded : classements du mois dont le top 3 gagne à la fin du mois (une seule fois, sur un serveur avec EterResource) :
#   money : argent ; keys : clés de monde ressource ; pass-xp : XP du pass du nouveau mois
ranking:
  rewarded: [general, votes]
  rewards:
    1:
      money: 1500
      keys: 3
      pass-xp: 1200
    2:
      money: 1000
      keys: 2
      pass-xp: 800
    3:
      money: 500
      keys: 1
      pass-xp: 400

# Votes : le plugin Vote du site lance « eterreward vote {player} » dans la console (par AzLink, « joueur en ligne
# requis » décoché) à chaque vote validé. Le joueur peut être hors ligne ou sur un autre serveur : pas d'objets ici,
# seulement ce qui passe par la base. Chaque vote compte au classement « votes » du mois et au général.
# loots : UN tirage par vote, au hasard selon weight ; money (Heloks), pass-xp, keys (clés de monde ressource),
# commands (console, {player}), label (texte affiché à la place du détail).
# streak : bonus au premier vote du jour quand la série atteint ce nombre de jours (un jour sans vote la remet à 1).
# Repères : en votant sur 4 sites par jour, un joueur reçoit en moyenne ~180 Heloks, ~160 XP de pass et ~0,6 clé par
# jour, plus les bonus de série (grille d'EterEconomy : les gains gratuits restent une petite part du revenu).
votes:
  # Merci annoncé sur tout le réseau à chaque vote.
  announce: true
  loots:
    - weight: 45
      money: 100
    - weight: 40
      pass-xp: 100
    - weight: 15
      keys: 1
  streak:
    3:
      money: 250
    7:
      keys: 1
      pass-xp: 200
    14:
      keys: 2
      pass-xp: 400

# Menus : bouton en bas du menu. Avec une commande (sans le /), il la lance pour le joueur et relie les menus entre
# eux ; vide, il ramène au menu central /menu ; "close", il ferme. Ici : le sous-menu Progression de /menu.
menus:
  daily:
    back-command: "menu progression"
  pass:
    back-command: "menu progression"
  challenges:
    back-command: "menu progression"
  ranking:
    back-command: "menu progression"
