# EterReward messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
#   <info> = normal light gray text, <accent> = important words in orange.
# Values between <> such as <day> are filled in by the plugin. To show a literal "<", write \< inside 'single quotes'.
# A missing key falls back to the plugin's built-in text: you only need to keep the lines you change.
# The message prefix ("Core") is shared by all plugins: EterLib/config.yml > language.prefix.
# Shared texts ("Cancel", "Unknown player", "players only"...): in EterLib/lang/, for every plugin.

daily:
  available: "<info>Your daily reward is waiting: <accent>day <day></accent> of your streak!"
  available-reset: "<info>You missed a day: your streak is back to <accent>day 1</accent>. Your reward is waiting!"
  button: "<accent><bold>[Open rewards]</bold></accent>"
  button-hover: "<info>Open <accent>/daily"
  claimed: "<info>Day <accent><day></accent> claimed: <accent><content></accent>!"
  already: "<error>You already claimed today's reward. Next one in <accent><time></accent>."
  play-first: "<error>Play at least <accent><minutes> min</accent> today before claiming your reward: <accent><time></accent> to go."
  dropped: "<info>Inventory full: the rest is on the ground in front of you."
  economy-missing: "<error>The economy is not available: try again later."
  loot:
    line: "<dark_gray>• <white><content></white> <dark_gray>(<chance>%)"
    surprise: "Surprise"
  day:
    name: "<accent>Day <day>"
    name-last: "<primary><bold>Day <day></bold></primary> <accent>· big reward"
    loots: "<info>Possible rewards:"
    claimed: "<success>✔ Claimed"
    claim: "<accent>Click <dark_gray>· <info>claim"
    upcoming: "<dark_gray>Upcoming"
  menu:
    title: "<primary>Daily reward"
    player: "<accent><player>"
    streak: "<info>Streak: <accent><days></accent><dark_gray>/</dark_gray><accent><cycle></accent> days"
    ready: "<success>● <info>Reward available"
    next: "<error>● <info>Next one in <accent><time>"
    rule: "<dark_gray>Miss a day: back to day 1"

pass:
  none: "<error>No season pass is available right now."
  # Sidebar line (EterTab, <tag_pass>), <tier> = tier reached, <max> = number of tiers
  sidebar: "  <info>Pass <accent>tier <tier></accent><info>/<max>"
  tier-reached: "<info>Pass tier <accent><tier></accent> reached! A reward is waiting for you."
  button: "<accent><bold>[Open the pass]</bold></accent>"
  button-hover: "<info>Open <accent>/pass"
  claimed: "<info>Tier <accent><tier></accent> claimed: <accent><content></accent>."
  dropped: "<info>Your inventory was full: the rest was dropped at your feet."
  premium-required: "<error>This reward is for the <accent>premium pass</accent> only."
  unavailable-here: "<error>This reward can't be given on this server: claim it from another one."
  season-over: "<error>This pass is over: a new one has started."
  locked: "<error>You haven't reached this tier yet."
  already: "<error>You already claimed this reward."
  luckperms-missing: "<error>LuckPerms is required to give the premium pass."
  premium-given: "<accent><player></accent> <info>has the premium <accent><pass></accent> pass until the end of the month."
  xp-given: "<accent><player></accent> <info>receives <accent><xp></accent> pass XP."
  set: "<info>This month's pass is now <accent><pass></accent>."
  unknown: "<error>Unknown pass: <accent><pass></accent>. Available: <accent><list></accent>."
  admin-usage: '<error>Usage: <accent>/eterreward pass premium \<player></accent>, <accent>set \<pass></accent> or <accent>xp \<player> \<amount></accent>'
  reward:
    keys: "<count> resource key(s)"
    minutes: "<count> min of resource world"
    permission: "<permission> (<duration>)"
    surprise: "a surprise"
