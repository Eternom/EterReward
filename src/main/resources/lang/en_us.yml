  permission:
    eteressential_craft: "/craft"
    eteressential_anvil: "/anvil"
    eteressential_smithing: "/smithing"
    eteressential_grindstone: "/grindstone"
    eteressential_stonecutter: "/stonecutter"
    eteressential_enderchest: "/enderchest"
    eteressential_furnace: "/furnace (portable furnace)"
    eteressential_back: "/back"
    eteressential_back_death: "/back after death"
    eterkit_kit_aventurier: "Adventurer kit"
    eterkit_kit_heros: "Hero kit"
    eterkit_kit_legende: "Legend kit"
  menu:
    title: "<primary>Pass <dark_gray>·</dark_gray> <pass>"
    player: "<accent><player>"
    tier: "<dark_gray>▸ <info>Tier: <accent><tier></accent>/<accent><max>"
    xp: "<dark_gray>▸ <info>Next tier: <accent><xp></accent>/<accent><needed> XP"
    complete: "<dark_gray>▸ <success>Pass complete!"
    premium-yes: "<dark_gray>▸ <info>Premium: <success>yes"
    premium-no: "<dark_gray>▸ <info>Premium: <accent>no"
    ends: "<dark_gray>▸ <info>Pass ends in <accent><time>"
    rule: "<dark_gray>Unclaimed rewards are lost at the end of the month."
    free-name: "<accent>Tier <tier></accent> <dark_gray>· <info>free"
    premium-name: "<accent>Tier <tier></accent> <dark_gray>· <primary>premium"
    reward: "<info>Reward: <accent><content>"
    claim: "<accent>Click <dark_gray>· <info>claim"
    claimed: "<success>Claimed"
    locked: "<dark_gray>Reach tier <tier> to unlock it."
    premium-locked: "<dark_gray>Premium pass only."
    tier-reached: "<success>Tier <tier> reached"
    tier-upcoming: "<info>Tier <accent><tier>"
    tier-xp: "<dark_gray><xp> XP in total"
    how: "<accent>Earning XP:"
    how-playtime: "<dark_gray>▸ <info>Playing: <accent><xp> XP</accent>/min (active), <accent><cap></accent> per day at most"
    how-daily: "<dark_gray>▸ <info>Daily reward (<accent>/daily</accent>): <accent><xp> XP"
    how-quests: "<dark_gray>▸ <info>Job quests: depending on their difficulty"
    challenges: "<accent>Daily and weekly challenges"
