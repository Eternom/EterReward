  button: "<accent><bold>[Ouvrir les récompenses]</bold></accent>"
  button-hover: "<info>Ouvrir <accent>/daily"
  claimed: "<info>Jour <accent><day></accent> réclamé : <accent><content></accent> !"
  already: "<error>Tu as déjà réclamé ta récompense aujourd'hui. Prochaine dans <accent><time></accent>."
  dropped: "<info>Inventaire plein : le reste est posé au sol devant toi."
  economy-missing: "<error>L'économie n'est pas disponible : réessaie plus tard."
  loot:
    line: "<dark_gray>• <white><content></white> <dark_gray>(<chance> %)"
    surprise: "Surprise"
  day:
    name: "<accent>Jour <day>"
    name-last: "<primary><bold>Jour <day></bold></primary> <accent>· grosse récompense"
    loots: "<info>Récompenses possibles :"
    claimed: "<success>✔ Réclamé"
    claim: "<accent>Clic <dark_gray>· <info>réclamer"
    upcoming: "<dark_gray>À venir"
  menu:
    title: "<primary>Récompense du jour"
    player: "<accent><player>"
    streak: "<info>Série : <accent><days></accent><dark_gray>/</dark_gray><accent><cycle></accent> jours"
    ready: "<success>● <info>Récompense disponible"
    next: "<error>● <info>Prochaine dans <accent><time>"
