# ============================================================
#  Défis du jour et de la semaine (/challenges)
# ============================================================
#
#  Chaque jour (minuit) et chaque semaine (lundi minuit, avec les missions du pass), dans le fuseau daily.time-zone de config.yml, des défis
#  sont tirés au hasard ici, les MÊMES pour tout le réseau. Un défi validé donne de l'XP du pass et de l'argent.
#  Le texte de chaque défi est dans lang/ (challenges.list.<identifiant>), <target> = le nombre à atteindre.
#
#  kind  : break (casser des blocs NATURELS : un bloc posé par un joueur ne compte pas), harvest (récolter des
#          cultures mûres), kill (tuer des créatures), fish (pêcher), quest (valider des quêtes de métier)
#  match : blocs ou créatures qui comptent (vide : tout). Groupes : #ores, #logs, #stone, #dirt, #sand, #monsters
#  target, icon ; xp et money pour changer la récompense d'un défi (sinon : defaults)
#  min-rank (kill) : monstres d'EterMob d'au moins ce rang seulement (2 Robuste, 3 Dangereux, 4 Élite, 5 Fléau)
#  Garder ce fichier identique sur tous les serveurs (un défi absent d'un serveur n'y avance pas).
#  Toute modification nécessite un redémarrage.

daily-count: 3
weekly-count: 3
# Missions du pass : tirées chaque semaine (lundi minuit) parmi celles que le pass du mois choisit (passes/<pass>.yml >
# missions), sinon parmi toutes. Plus longues, elles rapportent plus d'XP (source « mission » de /pass history).
missions-count: 3
# Défi de clan de la semaine (lundi minuit) : tous les membres avancent ensemble ; à l'objectif, chaque membre qui a
# aidé reçoit la récompense (une fois). Sans EterClan, ou sans clan, il ne s'affiche pas.
clan-count: 1

# Récompense par défaut. Repère : 3 défis du jour + 3 de la semaine valent ~470 XP du pass par jour.
defaults:
  daily:
    xp: 100
    money: 30
  weekly:
    xp: 300
    money: 150
  missions:
    xp: 500
    money: 200
  clan:
    xp: 400
    money: 1000

