# Pass « voyage » : un des pass tirés au hasard chaque mois (voir config.yml > pass).
# Chaque palier (1 à 30) a une ligne gratuite (free) et une ligne premium (premium), chacune facultative.
# Une récompense peut donner, ensemble :
#   money            : de l'argent (EterEconomy)
#   keys             : des clés de monde ressource (EterResource)
#   resource-minutes : du temps de monde ressource (EterResource)
#   items            : des objets, "MATIÈRE quantité" ; ce qui ne rentre pas est posé au sol
#   permissions      : "permission durée" (d, h, m), par LuckPerms, sur tout le réseau. La durée est la sienne,
#                      même après la fin du pass. Seulement des commandes d'usage (/craft, /back...), jamais
#                      ce que le joueur garde (homes, annonces) : il le perdrait à la fin.
#   commands         : lancées par la console, {player} = le pseudo
#   label            : texte affiché à la place du détail (MiniMessage)

name: "<primary>Le Grand voyage"
icon: COMPASS
description:
  - "<info>Pars loin, reviens chargé."
  - "<info>Temps de jeu : jusqu'à <accent>800 XP</accent> par jour (au lieu de 500)."

# Bonus du mois : quest-job / quest-multiplier (XP des quêtes), daily-multiplier (XP de /daily),
# playtime-cap (plafond d'XP de temps de jeu par jour), challenge-multiplier (XP des défis), vote-multiplier (XP de pass
# des votes).
bonus:
  playtime-cap: 800

