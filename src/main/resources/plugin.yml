name: EterReward
version: '${version}'

main: fr.eternom.eterReward.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: Récompenses du réseau (récompense quotidienne sur 7 jours, pass de saison).
depend: [EterLib, EterEconomy]
# EterMarket : XP du pass pour les quêtes ; EterResource : clés de ressource ; LuckPerms : permissions temporaires
softdepend: [EterMarket, EterResource, LuckPerms]

commands:
  daily:
    description: Récompense quotidienne (série de 7 jours).
    usage: /daily
    aliases: [reward, recompense]
    permission: eterreward.daily
  pass:
    description: Le pass de saison du mois.
    usage: /pass
    aliases: [battlepass, saison]
    permission: eterreward.pass
  eterreward:
    description: Gérer le pass (staff, aussi depuis la console).
    usage: /eterreward pass <premium|set|xp> ...
    permission: eterreward.admin

permissions:
  eterreward.daily:
    description: Réclamer la récompense quotidienne.
    default: true
  eterreward.pass:
    description: Le pass de saison (ligne gratuite) et son XP de temps de jeu.
    default: true
  eterreward.pass.premium.*:
    description: La ligne premium de tous les pass. D'habitude, on donne eterreward.pass.premium.<pass> pour le mois.
    default: op
  eterreward.admin:
    description: Toutes les permissions d'EterReward, et /eterreward pass.
    default: op
    children:
      eterreward.daily: true
      eterreward.pass: true
      eterreward.pass.premium.*: true
