name: EterReward
version: '${version}'

main: fr.eternom.eterReward.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: Récompenses du réseau (récompense quotidienne sur 7 jours, pass de saison, défis, classements).
depend: [EterLib, EterEconomy]
# EterJob : XP du pass pour les quêtes ; EterResource : clés de ressource ; LuckPerms : permissions temporaires ;
# EterClan : objectifs de clan et premium du clan ; EterSuccess : XP des succès
softdepend: [EterJob, EterResource, LuckPerms, EterNpc, PlaceholderAPI, EterSync, EterClan, EterSuccess]

commands:
  daily:
    description: Récompense quotidienne (série de 7 jours).
    usage: /daily
    aliases: [reward]
    permission: eterreward.daily
  pass:
    description: Le pass de saison du mois.
    usage: /pass [box|history|premium]
    aliases: [battlepass]
    permission: eterreward.pass
  challenges:
    description: Les défis du jour et de la semaine.
    usage: /challenges
    aliases: [challenge]
    permission: eterreward.challenges
  ranking:
    description: Les classements du réseau (et les récompenses du mois).
    usage: /ranking [general|pass|challenges|quests|votes|playtime|success|wealth|clans]
    aliases: [leaderboard, top]
    permission: eterreward.ranking
  sponsor:
    description: "Parrainage : désigner son parrain (nouveaux joueurs), voir ses filleuls."
    usage: /sponsor [joueur]
    aliases: [referral, parrain]
    permission: eterreward.sponsor
  eterreward:
    description: Gérer le pass, poser le podium du classement général, enregistrer un vote (staff, console).
    usage: /eterreward <pass <premium|gift|skip|set|reload|xp|setxp|info|reset|unclaim|event> ... | podium <1-5> | vote <joueur>>
    permission: eterreward.admin

permissions:
  eterreward.daily:
    description: Réclamer la récompense quotidienne.
    default: true
  eterreward.pass:
    description: Le pass de saison (ligne gratuite) et son XP de temps de jeu.
    default: true
  eterreward.challenges:
    description: Les défis du jour et de la semaine.
    default: true
  eterreward.ranking:
    description: Voir les classements.
    default: true
  eterreward.sponsor:
    description: Parrainage (/sponsor).
    default: true
  eterreward.pass.premium.*:
    description: La ligne premium de tous les mois. D'habitude, le premium est donné en base pour le mois (boutique, achat en jeu).
    default: op
  eterreward.pass.premium.always:
    description: "Le premium de chaque mois tant que la permission est là (ex : grade Légende)."
    default: false
  eterreward.admin:
    description: Toutes les permissions d'EterReward, et /eterreward pass.
    default: op
    children:
      eterreward.daily: true
      eterreward.pass: true
      eterreward.challenges: true
      eterreward.ranking: true
      eterreward.pass.premium.*: true
